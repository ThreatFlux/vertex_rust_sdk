[package]
name = "threatflux-vertex-rust-sdk"
version = "0.9.0"
edition = "2021"
rust-version = "1.96.0"
authors = ["ThreatFlux Team"]
description = "Community-maintained async Rust client for generative AI APIs on Google Cloud Vertex AI"
license = "MIT"
repository = "https://github.com/ThreatFlux/vertex_rust_sdk"
documentation = "https://docs.rs/threatflux-vertex-rust-sdk"
readme = "README.md"
keywords = ["vertex-ai", "google-cloud", "gemini", "ai", "ml"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
# HTTP Client
reqwest = { version = "0.13.3", default-features = false, features = ["form", "json", "query", "rustls", "stream"] }
# Async runtime
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1.18"
# JSON serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Error handling
anyhow = "1.0.102"
thiserror = "2.0.18"
# Time handling
chrono = { version = "0.4.44", features = ["serde"] }
# UUID generation
uuid = { version = "1.23.1", features = ["v4"] }
# Logging
log = "0.4.30"
env_logger = "0.11.10"
tracing = "0.1.44"
# OAuth2 and JWT
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
# Server-sent events
futures = "0.3.32"
futures-util = "0.3.32"
# Google Cloud authentication
gcp_auth = "0.12.6"
# Additional utilities
bytes = "1.11.1"
async-trait = "0.1.89"
base64 = "0.23.0"
toml = "1.1.2"
dotenvy = "0.15.7"
config = "0.15.23"
url = "2.5.8"
http = "1.4.0"
eventsource-stream = "0.2.3"
mime = "0.3.17"
# CLI (optional, for bin targets)
clap = { version = "4.6.1", features = ["derive"], optional = true }
colored = { version = "3.1.1", optional = true }
indicatif = { version = "0.18.4", optional = true }

[dev-dependencies]
tokio-test = "0.4.5"
mockito = "1.7.2"
tempfile = "3.27.0"
criterion = { version = "0.8.2", features = ["html_reports"] }
assert_cmd = "2.2.2"
predicates = "3.1.4"
once_cell = "1.21.4"
rand = "0.10.0"

[features]
default = ["blocking", "cli"]
blocking = ["reqwest/blocking"]
native-tls = ["reqwest/native-tls-vendored"]
rustls-tls = ["reqwest/rustls"]
cli = ["clap", "colored", "indicatif"]
examples = []
integration-tests = []

[lib]
name = "threatflux_vertex_rust_sdk"
path = "src/lib.rs"

[[bin]]
name = "vertex"
path = "src/bin/vertex.rs"
required-features = ["cli"]

[[bin]]
name = "vertex-test"
path = "src/bin/vertex-test.rs"
required-features = ["cli"]

[[bin]]
name = "vertex-chat"
path = "src/bin/chat.rs"
required-features = ["cli"]

[[example]]
name = "basic_generation"
path = "examples/basic_generation.rs"
required-features = ["examples"]

[[example]]
name = "streaming"
path = "examples/streaming/main.rs"
required-features = ["examples"]

[[example]]
name = "function_calling"
path = "examples/function_calling/main.rs"
required-features = ["examples"]

[[example]]
name = "token_counting"
path = "examples/token_counting.rs"
required-features = ["examples"]

[[example]]
name = "chat"
path = "examples/chat.rs"
required-features = ["examples"]

[[example]]
name = "context_caching"
path = "examples/context_caching/main.rs"
required-features = ["examples"]

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"
required-features = ["integration-tests"]

[[bench]]
name = "benchmarks"
harness = false
