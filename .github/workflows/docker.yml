name: Docker

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/docker.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Auto-release's GitHub App pushes the release commit to main and then tags
# it, so one commit gets a branch run (main, latest) and a tag run (semver
# tags). Both push the short-SHA image tag that scan and sbom pull, so push
# runs for the same commit wait for each other instead of overwriting that tag
# mid-scan. Every other event gets its own group and is never queued.
concurrency:
  group: docker-${{ github.event_name == 'push' && github.sha || github.run_id }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1
  BINARY_NAME: ${{ vars.RUST_TEMPLATE_BINARY_NAME || 'vertex' }}
  BINARY_PACKAGE: ${{ vars.RUST_TEMPLATE_BINARY_PACKAGE || 'threatflux-vertex-rust-sdk' }}
  SBOM_MANIFEST_PATH: ${{ vars.RUST_TEMPLATE_SBOM_MANIFEST_PATH || 'Cargo.toml' }}
  # CLI name symlinked next to the fixed /usr/local/bin/app entrypoint.
  CLI_NAME: ${{ vars.RUST_TEMPLATE_CLI_NAME || vars.RUST_TEMPLATE_BINARY_NAME || 'vertex' }}
  OCI_IMAGE_TITLE: ThreatFlux Vertex Rust SDK CLI
  OCI_IMAGE_DESCRIPTION: ThreatFlux Vertex AI Rust SDK command-line interface
  OCI_IMAGE_VENDOR: ThreatFlux
  OCI_IMAGE_SOURCE: https://github.com/ThreatFlux/vertex_rust_sdk

jobs:
  build:
    name: Build Docker Image
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    # The linux/arm64 image compiles under QEMU emulation, sharing the runner
    # with the native amd64 build. The first multi-platform build on main took
    # 94 minutes (arm64: cargo build 67, cargo-cyclonedx install 23), so leave
    # roughly twice that.
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_name: ${{ steps.lowercase.outputs.image_name }}
      platforms: ${{ steps.platforms.outputs.value }}
      needs_qemu: ${{ steps.platforms.outputs.needs_qemu }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lowercase image name
        id: lowercase
        run: echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Detect Rust toolchain version
        id: rust_toolchain
        run: |
          TOOLCHAIN_VERSION="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' rust-toolchain.toml | sed -n '1p')"
          echo "version=${TOOLCHAIN_VERSION}" >> "$GITHUB_OUTPUT"

      # Pushed images are multi-platform, matching rust-cicd-template. Set the
      # RUST_TEMPLATE_DOCKER_PLATFORMS variable to override the list. Pull
      # requests always build linux/amd64 only (see "Build and export (PRs)").
      # QEMU is needed when this run builds any platform other than the
      # runner's own.
      - name: Select build platforms
        id: platforms
        env:
          PLATFORMS: ${{ vars.RUST_TEMPLATE_DOCKER_PLATFORMS || 'linux/amd64,linux/arm64' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "value=${PLATFORMS}" >> "$GITHUB_OUTPUT"
          targets="${PLATFORMS}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            targets="linux/amd64"
          fi
          native="$(docker version --format '{{ .Server.Os }}/{{ .Server.Arch }}')"
          needs_qemu=false
          IFS=',' read -ra target_platforms <<< "${targets}"
          for platform in "${target_platforms[@]}"; do
            if [[ "${platform//[[:space:]]/}" != "${native}" ]]; then
              needs_qemu=true
            fi
          done
          echo "Runner platform ${native}; building ${targets}; QEMU needed: ${needs_qemu}"
          echo "needs_qemu=${needs_qemu}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.platforms.outputs.needs_qemu == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract runtime metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract base image metadata
        id: base_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_name }}
          tags: |
            type=raw,value=base-rust-${{ steps.rust_toolchain.outputs.version }}
            type=raw,value=base-rust-latest,enable={{is_default_branch}}

      - name: Build base image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: rust-base
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          tags: ${{ steps.base_meta.outputs.tags }}
          labels: ${{ steps.base_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            BINARY_NAME=${{ env.BINARY_NAME }}
            BINARY_PACKAGE=${{ env.BINARY_PACKAGE }}
            SBOM_MANIFEST_PATH=${{ env.SBOM_MANIFEST_PATH }}
            CLI_NAME=${{ env.CLI_NAME }}

      - name: Build and export (PRs)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ steps.lowercase.outputs.image_name }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            BINARY_NAME=${{ env.BINARY_NAME }}
            BINARY_PACKAGE=${{ env.BINARY_PACKAGE }}
            SBOM_MANIFEST_PATH=${{ env.SBOM_MANIFEST_PATH }}
            CLI_NAME=${{ env.CLI_NAME }}
            OCI_IMAGE_TITLE=${{ env.OCI_IMAGE_TITLE }}
            OCI_IMAGE_DESCRIPTION=${{ env.OCI_IMAGE_DESCRIPTION }}
            OCI_IMAGE_VENDOR=${{ env.OCI_IMAGE_VENDOR }}
            OCI_IMAGE_SOURCE=${{ env.OCI_IMAGE_SOURCE }}

      - name: Build and push runtime image (non-PR)
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            BINARY_NAME=${{ env.BINARY_NAME }}
            BINARY_PACKAGE=${{ env.BINARY_PACKAGE }}
            SBOM_MANIFEST_PATH=${{ env.SBOM_MANIFEST_PATH }}
            CLI_NAME=${{ env.CLI_NAME }}
            OCI_IMAGE_TITLE=${{ env.OCI_IMAGE_TITLE }}
            OCI_IMAGE_DESCRIPTION=${{ env.OCI_IMAGE_DESCRIPTION }}
            OCI_IMAGE_VENDOR=${{ env.OCI_IMAGE_VENDOR }}
            OCI_IMAGE_SOURCE=${{ env.OCI_IMAGE_SOURCE }}

      - name: Upload image artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  scan:
    name: Security Scan
    needs: build
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download image (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image
          path: /tmp

      # Runs images built for a platform other than this runner's: the amd64
      # pull request image on an arm64 runner, or the non-native platforms in
      # "Smoke test every platform".
      - name: Set up QEMU
        if: needs.build.outputs.needs_qemu == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Load image (PRs)
        if: github.event_name == 'pull_request'
        run: docker load -i /tmp/image.tar

      - name: Get short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        if: github.event_name != 'pull_request'
        run: docker pull ${{ env.REGISTRY }}/${{ needs.build.outputs.image_name }}:${{ steps.sha.outputs.short }}

      # The runtime is distroless (no shell), so check the CLI, the non-root
      # user and the embedded SBOM from outside the container.
      - name: Smoke test image
        env:
          IMAGE: ${{ github.event_name == 'pull_request' && format('{0}:scan', needs.build.outputs.image_name) || format('{0}/{1}:{2}', env.REGISTRY, needs.build.outputs.image_name, steps.sha.outputs.short) }}
        run: |
          set -euo pipefail
          docker run --rm "${IMAGE}" --version
          docker run --rm "${IMAGE}" --help > /dev/null
          docker run --rm --entrypoint "/usr/local/bin/${CLI_NAME}" "${IMAGE}" --version
          image_user="$(docker image inspect --format '{{ .Config.User }}' "${IMAGE}")"
          if [[ "${image_user}" != "65532:65532" ]]; then
            echo "Image runs as '${image_user}', expected the distroless nonroot user 65532:65532" >&2
            exit 1
          fi
          container="$(docker create "${IMAGE}")"
          trap 'docker rm "${container}" > /dev/null' EXIT
          docker cp "${container}:/usr/share/doc/app/sbom.cdx.json" "${RUNNER_TEMP}/sbom.cdx.json"
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' "${RUNNER_TEMP}/sbom.cdx.json" > /dev/null

      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ github.event_name == 'pull_request' && format('{0}:scan', needs.build.outputs.image_name) || format('{0}/{1}:{2}', env.REGISTRY, needs.build.outputs.image_name, steps.sha.outputs.short) }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          vuln-type: os,library
        continue-on-error: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
        if: always() && hashFiles('trivy-results.sarif') != ''

      # The steps above test and scan the runner's own platform. Check that the
      # pushed index holds every requested platform, then run each other
      # platform's CLI under QEMU, so a missing or broken image fails the run
      # before it is signed.
      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Smoke test every platform
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.build.outputs.image_name }}:${{ steps.sha.outputs.short }}
          PLATFORMS: ${{ needs.build.outputs.platforms }}
        run: |
          set -euo pipefail
          index="$(docker buildx imagetools inspect --raw "${IMAGE}")"
          if jq -e 'has("manifests")' <<< "${index}" > /dev/null; then
            pushed="$(jq -r '.manifests[].platform // empty
              | [.os, .architecture, .variant] | map(select(. != null and . != "")) | join("/")' <<< "${index}")"
          else
            # A single-platform manifest, not an index: read its platform from
            # the image config, so a multi-platform request fails below.
            pushed="$(docker buildx imagetools inspect --format '{{ json .Image }}' "${IMAGE}" |
              jq -r '[.os, .architecture, .variant] | map(select(. != null and . != "")) | join("/")')"
          fi
          echo "Pushed platforms: $(tr '\n' ' ' <<< "${pushed}")"
          native="$(docker version --format '{{ .Server.Os }}/{{ .Server.Arch }}')"
          IFS=',' read -ra platforms <<< "${PLATFORMS}"
          for platform in "${platforms[@]}"; do
            platform="${platform//[[:space:]]/}"
            if ! grep -qxF "${platform}" <<< "${pushed}"; then
              echo "::error::${IMAGE} has no ${platform} image"
              exit 1
            fi
            if [[ "${platform}" == "${native}" ]]; then
              continue
            fi
            echo "::group::Smoke test ${platform}"
            # The runner's classic image store keeps one platform per image
            # reference, so drop the copy pulled for another platform first.
            docker image rm "${IMAGE}" > /dev/null 2>&1 || true
            docker pull --quiet --platform "${platform}" "${IMAGE}"
            docker run --rm --platform "${platform}" "${IMAGE}" --version
            docker run --rm --platform "${platform}" "${IMAGE}" --help > /dev/null
            container="$(docker create --platform "${platform}" "${IMAGE}")"
            user="$(docker container inspect --format '{{ .Config.User }}' "${container}")"
            docker rm "${container}" > /dev/null
            if [[ "${user}" != "65532:65532" ]]; then
              echo "::error::${platform} image runs as '${user}', expected the distroless nonroot user 65532:65532"
              exit 1
            fi
            echo "::endgroup::"
          done

  sign:
    name: Sign Container
    needs: [build, scan]
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign container image
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ needs.build.outputs.image_name }}@${{ needs.build.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: 1

  sbom:
    name: Generate SBOM
    needs: build
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Get short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ needs.build.outputs.image_name }}:${{ steps.sha.outputs.short }}
          artifact-name: sbom.spdx.json
          format: spdx-json
        continue-on-error: true
